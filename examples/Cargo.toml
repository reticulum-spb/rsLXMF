[package]
name = "lxmf-examples"
description = "Rust counterparts to LXMF/docs example_sender.py and example_receiver.py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["reticulum-full"]
reticulum-full = ["lxmf-core/reticulum-full", "rns-runtime/full"]
reticulum-client = ["lxmf-core/reticulum-client", "rns-runtime/client"]

[dependencies]
lxmf-core = { workspace = true }
rns-crypto = { workspace = true }
rns-identity = { workspace = true }
rns-runtime = { workspace = true }
rns-transport = { workspace = true }
bytes = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true }
