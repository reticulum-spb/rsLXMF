[package]
name = "lxmf-core"
description = "LXMF messaging protocol implementation for Reticulum"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["sqlite-bundled", "reticulum-full"]
sqlite = ["dep:rusqlite"]
sqlite-bundled = ["sqlite", "rusqlite/bundled"]
reticulum-full = ["rns-runtime/full"]
reticulum-client = ["rns-runtime/client"]

[dependencies]
base64 = { workspace = true }
rns-crypto = { workspace = true }
rns-wire = { workspace = true }
rns-identity = { workspace = true }
rns-protocol = { workspace = true }
rns-transport = { workspace = true }
rns-runtime = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
rmp-serde = { workspace = true }
rmpv = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
rusqlite = { workspace = true, optional = true }
tempfile = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
