[package]
name = "lxmf-tools"
description = "Rust LXMF daemon and CLI tools for Reticulum"
version.workspace = true
edition.workspace = true
license.workspace = true
autobins = false

[features]
default = ["sqlite-bundled", "reticulum-full"]
sqlite = ["lxmf-core/sqlite"]
sqlite-bundled = ["lxmf-core/sqlite-bundled"]
reticulum-full = ["lxmf-core/reticulum-full", "rns-runtime/full", "rns-runtime/serial"]
reticulum-client = ["lxmf-core/reticulum-client", "rns-runtime/client"]

[dependencies]
lxmf-core = { workspace = true }
rns-runtime = { workspace = true }
rns-identity = { workspace = true }
rns-transport = { workspace = true }
rns-wire = { workspace = true }
rns-crypto = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
rmpv = { workspace = true }

[[bin]]
name = "lxmd-rs"
path = "src/bin/lxmd-rs.rs"
